{% extends "user/user_base.html" %}

{% block title %}
Notifications
{% endblock %}

{% block content %}

<h2>Notifications</h2>
<br>


<table>

<tr>
    <th>Date</th>
    <th>Message</th>
</tr>

{% for notification in notifications %}

<tr>
    <td>{{ notification.publish_date }}</td>
    <td>{{ notification.message }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
