{% extends "user/user_base.html" %}

{% block title %}
Edit Registration
{% endblock %}

{% block content %}

<h2>Edit Registration — {{ registration.tournament_name }}</h2>
<br>

<form method="POST">

    <label>Team Name</label>
    <input type="text" name="team_name" value="{{ registration.team_name }}" required>

    <label>Captain Name</label>
    <input type="text" name="captain_name" value="{{ registration.captain_name }}" required>

    <label>Captain Mobile No</label>
    <input type="tel" name="captain_mobile" value="{{ registration.captain_mobile }}" pattern="[0-9]{10}" maxlength="10"
        required>

    <label>Players</label>
    <div id="players_container" data-player-count="{{ player_list|length }}">
        {% for player in player_list %}
        <div class="player-row">
            <input type="text" name="player_names[]" value="{{ player }}" placeholder="Player {{ loop.index }} name"
                required>
        </div>
        {% endfor %}
    </div>
    <button type="button" id="add_player_btn" onclick="addPlayerField()">+ Add Player</button>
    <br><br>
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('user.user_dashboard') }}"><button type="button">Cancel</button></a>

</form>

<script>
    const MAX_PLAYERS = 15;
    let playerCount = 1;

    function addPlayerField() {
        if (playerCount >= MAX_PLAYERS) {
            alert("You can add a maximum of " + MAX_PLAYERS + " players.");
            return;
        }

        playerCount++;
        const container = document.getElementById("players_container");

        const row = document.createElement("div");
        row.className = "player-row";

        const input = document.createElement("input");
        input.type = "text";
        input.name = "player_names[]";
        input.placeholder = "Player " + playerCount + " name";

        row.appendChild(input);
        container.appendChild(row);

        if (playerCount >= MAX_PLAYERS) {
            document.getElementById("add_player_btn").disabled = true;
        }
    }
</script>

{% endblock %}
