{% extends "user/user_base.html" %}

{% block title %}
Tournament Registration
{% endblock %}

{% block content %}

<h2>Register for Tournament</h2>
<br>


<form method="POST">

    <label>Select Tournament</label>
    <select name="tournament_id" required>
        <option value="">-- Choose a tournament --</option>
        {% for tournament in tournaments %}
        <option value="{{ tournament.id }}">{{ tournament.tournament_name }}</option>
        {% endfor %}
    </select>

    <label>Team Name</label>
    <input type="text" name="team_name" required>

    <label>Captain Name</label>
    <input type="text" name="captain_name" required>

    <label>Captain Mobile No</label>
    <input type="tel" name="captain_mobile" pattern="[0-9]{10}" maxlength="10" required>

    <label>Players</label>
    <div id="players_container">
        <div class="player-row">
            <input type="text" name="player_names[]" placeholder="Player 1 name" required>
        </div>
    </div>
    <button type="button" onclick="addPlayerField()">+ Add Player</button>

    <br><br>
    <button type="submit">Register</button>

</form>

<script>
let playerCount = 1;

function addPlayerField() {
    playerCount++;
    const container = document.getElementById("players_container");

    const row = document.createElement("div");
    row.className = "player-row";

    const input = document.createElement("input");
    input.type = "text";
    input.name = "player_names[]";
    input.placeholder = "Player " + playerCount + " name";

    row.appendChild(input);
    container.appendChild(row);
}
</script>

{% endblock %}
