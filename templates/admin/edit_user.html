{% extends "admin/admin_base.html" %}

{% block title %}
Edit User
{% endblock %}

{% block content %}

<h2>Edit User — {{ user.username }}</h2>
<br>

<form method="POST" action="{{ url_for('admin.edit_user', username=user.username) }}">

    <label><b>Full Name</b></label>
    <input type="text" name="fullname" value="{{ user.fullname }}" required>

    <label><b>Username</b></label>
    <input type="text" value="{{ user.username }}" disabled>

    <label><b>Email</b></label>
    <input type="email" name="email" value="{{ user.email }}" required>

    <label><b>Mobile</b></label>
    <input type="tel" name="mobile" value="{{ user.mobile }}" maxlength="10" required>

    <br><br>

    <button type="submit">Save Changes</button>

    <a href="{{ url_for('admin.manage_users') }}"><button type="button">Cancel</button></a>

</form>

{% endblock %}
